name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server test suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Starts a fresh server per timer mode and runs all 10 suites.
      - run: npm test
